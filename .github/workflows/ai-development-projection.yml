name: AI-development projection

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-projection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - run: python3 docs/ai-development/validate_projection.py --profile djconnect-vibecast-receiver --source-commit 4a39841a0c85b0e9962c85a74a3fd49d9803c13d --extension-identity DJCONNECT_VIBECAST_RECEIVER_DEVELOPMENT_EXTENSION
