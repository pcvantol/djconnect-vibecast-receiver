name: Update published VibeCast bootstrap
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact reviewed protected main SHA including full live artifact delta
        required: true
        type: string
      artifact_run_id:
        description: Successful Verify receiver push/main run for that SHA
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: vibecast-bootstrap-production
  cancel-in-progress: false
jobs:
  update:
    if: github.repository == 'pcvantol/djconnect-vibecast-receiver' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: vibecast-production
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: bootstrap-${{ inputs.candidate_sha }}
          path: dist/bootstrap
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - run: npm ci --ignore-scripts
      - name: Qualify exact prior artifact, bound project and protected candidate
        run: node scripts/cloudflare_update.mjs prepare
      - run: node scripts/readback_cast.mjs
      - name: Upload same tested bytes to isolated preview
        run: npx --no-install wrangler pages deploy dist/bootstrap --project-name=vibecast-tv-bootstrap --branch="qualification-${CANDIDATE_SHA:0:12}" --commit-hash="$CANDIDATE_SHA" > bootstrap-preview.log
      - name: Verify preview and recheck production ownership and stale-main fence
        run: node scripts/cloudflare_update.mjs begin
      - name: Publish identical artifact to production
        run: npx --no-install wrangler pages deploy dist/bootstrap --project-name=vibecast-tv-bootstrap --branch=main --commit-hash="$CANDIDATE_SHA" > bootstrap-production.log
      - name: Confirm production identity and qualify immutable and root HTTPS hashes/headers
        run: node scripts/cloudflare_update.mjs adopt
      - run: node scripts/readback_cast.mjs
      - name: Restore only this run confirmed production on failure
        if: ${{ failure() && hashFiles('update-receipt.json') != '' }}
        run: node scripts/cloudflare_update.mjs rollback
      - name: Retain sanitized publication and recovery evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bootstrap-update-${{ github.sha }}-${{ github.run_id }}
          path: |
            update-receipt.json
            artifacts/update-prior/bootstrap/
            dist/bootstrap/
          if-no-files-found: warn
          retention-days: 2
