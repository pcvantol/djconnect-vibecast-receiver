name: Publish VibeCast bootstrap
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact reviewed and effect-approved protected main SHA
        required: true
        type: string
      artifact_run_id:
        description: Successful Verify receiver push/main run for that SHA
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: vibecast-bootstrap-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'pcvantol/djconnect-vibecast-receiver' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: vibecast-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Verify trusted source, CI and protected effect approval
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/promotion_guard.mjs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: bootstrap-${{ inputs.candidate_sha }}
          path: dist/bootstrap
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - run: npm ci --ignore-scripts
      - name: Verify exact tested artifact
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: node scripts/verify_bootstrap.mjs dist/bootstrap "$CANDIDATE_SHA"
      - run: node scripts/readback_cast.mjs
      - name: Recheck stale-run fence and publish isolated target
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node scripts/promotion_guard.mjs
          npx --no-install wrangler pages deploy dist/bootstrap --project-name=vibecast-tv-bootstrap --branch=main --commit-hash="$CANDIDATE_SHA" > bootstrap-deploy.log
      - name: Verify immutable deployment
        run: |
          node -e "const fs=require('fs'); const log=fs.readFileSync('bootstrap-deploy.log','utf8'); const url=log.match(/https:\/\/[a-z0-9]+\.vibecast-tv-bootstrap\.pages\.dev/); if(!url)throw Error('No immutable deployment URL'); fs.writeFileSync('immutable-url.txt',url[0]);"
          node scripts/readback_bootstrap.mjs dist/bootstrap/build-manifest.json "$(cat immutable-url.txt)"
      - run: node scripts/readback_cast.mjs
      - name: Verify production HTTPS bytes and headers
        run: node scripts/readback_bootstrap.mjs dist/bootstrap/build-manifest.json https://vibecast.tv
